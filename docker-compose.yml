services:
  db:
    image: postgres:alpine3.22
    container_name: medical_postgres
    restart: always
    environment:
      POSTGRES_USER: admin        
      POSTGRES_PASSWORD: password 
      POSTGRES_DB: medical_db     
    ports:
      - "5433:5432"               
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: